name: ROUND automated tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  export-video-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run export video tests
        run: node --test tests/export-video.test.cjs
