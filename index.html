<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d"><title>ROUND — Fitness Timer</title>
<style>
:root{--bg:#050507;--panel:#0b0a10;--panel2:#14101f;--purple:#8b5cf6;--purple2:#a78bfa;--text:#f5f3ff;--muted:#aaa0c0;--line:#302143;--danger:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{max-width:760px;margin:auto;padding:20px 16px 44px}.app.focus-mode{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-top:16px;padding-bottom:16px}.app.focus-mode header,.app.focus-mode .section-head,.app.focus-mode #blocks,.app.focus-mode .bottom-actions,.app.focus-mode .hint{display:none!important}.app.focus-mode .timer{flex:0 0 auto}.app.focus-mode .clock-ring{width:min(82vw,390px);margin:22px auto 26px}.app.focus-mode .clock-ring .clock{font-size:clamp(58px,16vw,100px)}.app.focus-mode .current-name{font-size:clamp(18px,4vw,24px)}.app.focus-mode .subline{font-size:13px}.app.focus-mode .progress{margin:28px 0}.app.focus-mode .controls{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;gap:10px}.app.focus-mode .control{height:54px;min-width:54px}.app.focus-mode .control{background:transparent!important;color:#aaa4bc!important;box-shadow:none!important}.app.focus-mode .control:hover{background:#ffffff0a!important;color:var(--text)!important}.app.focus-mode .control.primary{min-width:54px;width:54px;background:transparent!important;color:var(--text)!important}.app.focus-mode .control.primary:hover{background:#ffffff0a!important}.app.focus-mode .controls #prev,.app.focus-mode .controls #play,.app.focus-mode .controls #next{display:grid}.app.focus-mode .controls #reset{width:54px;min-width:54px;height:54px;background:transparent;color:#aaa4bc}.app.focus-mode .controls #reset svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;gap:10px;align-items:center;font-weight:900;letter-spacing:2px;font-size:18px}.mark{width:34px;height:34px;border:2px solid var(--purple);border-radius:10px;display:grid;place-items:center;color:var(--purple2);font-weight:900;transform:rotate(0deg)}.tag{color:var(--muted);font-size:11px;letter-spacing:1.4px}
.timer{background:linear-gradient(145deg,#100b19,#070609);border:1px solid #38204f;border-radius:24px;padding:25px 20px 20px;text-align:center;box-shadow:0 16px 50px #0004}.clock-ring{width:min(72vw,310px);aspect-ratio:1;border-radius:50%;margin:18px auto 20px;display:grid;place-items:center;position:relative;background:conic-gradient(var(--purple) var(--ring-progress,0%),#21142f 0);padding:5px}.clock-ring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#08060c;border:1px solid #261536}.clock-ring .clock-inner{position:relative;z-index:1;width:100%;padding:12px}.clock-ring .clock{font-size:clamp(48px,13vw,76px);letter-spacing:-3px;margin:0 0 8px}.timer .current-name{font-size:15px}.timer .subline{font-size:11px}
.phase{display:inline-flex;align-items:center;gap:8px;background:#211033;color:#d8c5ff;border-radius:99px;padding:7px 13px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--purple2)}
.clock{font-size:clamp(64px,18vw,110px);line-height:1.08;font-weight:850;letter-spacing:-5px;font-variant-numeric:tabular-nums;margin:18px 0 4px}.current-name{font-size:16px;font-weight:700;min-height:24px}.subline{font-size:12px;color:var(--muted);margin-top:6px}.progress{height:4px;background:#21142f;border-radius:9px;overflow:hidden;margin:20px 0}.progress>div{height:100%;width:0;background:var(--purple);transition:width .15s linear}
.controls{display:flex;justify-content:center;gap:18px;align-items:center}.app:not(.focus-mode) .controls #prev,.app:not(.focus-mode) .controls #reset,.app:not(.focus-mode) .controls #next{display:none}.control{display:grid;place-items:center;background:transparent;border:0;border-radius:50%;width:38px;min-width:38px;height:38px;padding:0;color:#aaa4bc;transition:color .15s,background .15s}.control svg{width:19px;height:19px;display:block}.control:hover{color:var(--text);background:#ffffff0a}.control.primary{width:54px;min-width:54px;height:54px;background:var(--purple);color:white;border:0;border-radius:50%;padding:0}.control.primary svg{width:20px;height:20px}.control.primary:hover{background:var(--purple2)}#playLabel{display:none}.control:active,.btn:active{transform:scale(.96)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:27px 2px 12px}.section-head h2{font-size:14px;letter-spacing:.5px;margin:0}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid #41345d;background:#211a31;color:#d8ccff;padding:10px 13px;border-radius:11px;font-size:12px;font-weight:750}.btn.main{background:var(--purple);border-color:var(--purple);color:white}.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}.btn.danger{color:var(--danger);border-color:#513038;background:#26171c}
.empty{border:1px dashed #393346;border-radius:18px;padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}.empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}
.blocks{display:flex;flex-direction:column;gap:10px} .block{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden}.block.standalone{border-color:#563582;background:#0d0914}.drag-handle{font-size:20px;cursor:grab;touch-action:none;user-select:none}.drag-handle:active{cursor:grabbing}.dragging{opacity:.45;outline:1px solid var(--purple)}.block-top{display:flex;gap:10px;align-items:center;padding:13px;cursor:pointer;user-select:none}.block-top:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}.block-index{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:9px;background:#241038;color:#d8c5ff;font-size:12px;font-weight:800}.block-title{min-width:0;flex:1}.block-title strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.block-title small{color:var(--muted);font-size:11px;display:block;margin-top:4px}.block-actions{display:flex;gap:4px}.iconbtn{width:30px;height:30px;border-radius:8px;background:var(--panel2);color:#b9b3ca;font-size:14px}.block-body{padding:0 13px 13px;display:none}.block.open .block-body{display:block}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.8px;text-transform:uppercase}.field input,.field select{width:100%;min-width:0;background:#070509;border:1px solid #352044;border-radius:9px;padding:10px;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--purple)}.block-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.footer-actions{display:flex;gap:7px;flex-wrap:wrap}.total{font-size:11px;color:var(--muted)}.bottom-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.bottom-actions .btn{flex:1}.saved-section{margin-top:24px}.saved-list{display:flex;flex-direction:column;gap:8px}.saved-item{display:flex;align-items:center;gap:8px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.saved-item .saved-name{font-size:13px;font-weight:750;min-width:0;flex:1;overflow-wrap:anywhere}.saved-item .saved-meta{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}.saved-item .btn{padding:8px 10px}.app.focus-mode .saved-section{display:none!important}.hint{font-size:11px;color:#777286;text-align:center;margin-top:22px}
@media(min-width:600px){.app{padding-top:28px}.timer{padding:30px}.fields{grid-template-columns:repeat(4,minmax(0,1fr))}.field.namefield{grid-column:span 2}}
</style>
</head>
<body><main class="app">
<header><div class="brand"><div class="mark">R</div><span>ROUND</span></div><span class="tag">FITNESS TIMER</span></header>
<section class="timer" aria-label="Cronômetro">
<div class="phase"><span class="dot"></span><span id="phase">PRONTO</span></div>
<div class="clock-ring" id="clockRing"><div class="clock-inner"><div class="clock" id="clock">00:00</div><div class="current-name" id="currentName">Adicione seu primeiro round</div><div class="subline" id="counter">Nenhum round configurado</div></div></div>
<div class="progress"><div id="progress"></div></div>
<div class="controls"><button class="control" id="prev" aria-label="Anterior" title="Anterior"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5v14M19 6l-9 6 9 6z"/></svg></button><button class="control primary" id="play" aria-label="Iniciar ou pausar" title="Iniciar ou pausar"><span id="playIcon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span id="playLabel">INICIAR</span></button><button class="control" id="reset" aria-label="Parar timer" title="Parar timer"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button><button class="control" id="next" aria-label="Próximo" title="Próximo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5v14M5 6l9 6-9 6z"/></svg></button></div>
</section>
<div class="section-head"><h2>SEU TREINO</h2><span class="muted" id="summary">0 blocos · 0 rounds</span></div>
<div id="blocks" class="blocks"></div>
<div class="bottom-actions"><button class="btn main" id="addBlock">＋ Adicionar bloco</button><button class="btn" id="addRound">＋ Adicionar round</button><button class="btn ghost" id="clearAll">Limpar treino</button></div>
<section class="saved-section"><div class="section-head"><h2>TIMERS SALVOS</h2><span class="muted" id="savedCount">0 salvos</span></div><div id="savedTimers" class="saved-list"></div><button class="btn" id="saveTimer" style="width:100%;margin-top:10px">＋ Salvar timer montado</button></section>
<p class="hint">Edite nomes, tempos e ordem. Seus timers salvos ficam neste dispositivo.</p>
</main>
<script>
const $=id=>document.getElementById(id);
let blocks=[],active=0,remaining=0,running=false,interval=null,lastStamp=0,phaseMode='work';
let savedTimers=[];
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const allRounds=()=>blocks.flatMap((b,bi)=>b.rounds.map((r,ri)=>({...r,bi,ri,blockName:b.name})));
const rounds=()=>allRounds();
function save(){try{localStorage.setItem('round-fitness-v1',JSON.stringify(blocks))}catch(e){}}
function loadSavedTimers(){try{const x=JSON.parse(localStorage.getItem('round-saved-timers-v1')||'[]');savedTimers=Array.isArray(x)?x.filter(t=>t&&typeof t.name==='string'&&Array.isArray(t.blocks)):[]}catch(e){savedTimers=[]}}
function persistSavedTimers(){try{localStorage.setItem('round-saved-timers-v1',JSON.stringify(savedTimers))}catch(e){alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio.')}}
function renderSavedTimers(){const host=$('savedTimers');host.innerHTML='';$('savedCount').textContent=savedTimers.length+' salvo'+(savedTimers.length===1?'':'s');if(!savedTimers.length){host.innerHTML='<div class="empty" style="padding:16px"><strong>Nenhum timer salvo</strong>Monte um treino e toque em “Salvar timer montado”.</div>';return}savedTimers.forEach((t,i)=>{const count=t.blocks.reduce((n,b)=>n+(b.rounds||[]).length,0);const seconds=t.blocks.reduce((n,b)=>n+(b.rounds||[]).reduce((s,r)=>s+(Number(r.duration)||0)+(Number(r.rest)||0),0),0);const row=document.createElement('div');row.className='saved-item';row.innerHTML='<div class="saved-name"></div><div><button class="btn main load-saved">Abrir</button> <button class="btn ghost delete-saved">×</button></div>';const label=document.createElement('span');label.className='saved-meta';label.textContent=count+' rounds · '+fmt(seconds);row.querySelector('.saved-name').textContent=t.name;row.querySelector('.saved-name').appendChild(label);row.querySelector('.load-saved').onclick=()=>{if(running)stop();document.querySelector('.app').classList.remove('focus-mode');blocks=JSON.parse(JSON.stringify(t.blocks));active=0;phaseMode='work';remaining=current()?totalSeconds(current()):0;save();render()};row.querySelector('.delete-saved').onclick=()=>{if(confirm('Excluir o timer salvo “'+t.name+'”?')){savedTimers.splice(i,1);persistSavedTimers();renderSavedTimers()}};host.appendChild(row)})}
function saveCurrentTimer(){if(!rounds().length){alert('Adicione pelo menos um round antes de salvar.');return}const suggested='Timer '+(savedTimers.length+1);const name=prompt('Nome para este timer:',suggested);if(name===null)return;const clean=name.trim();if(!clean){alert('Digite um nome para o timer.');return}savedTimers.push({name:clean,blocks:JSON.parse(JSON.stringify(blocks)),updatedAt:Date.now()});persistSavedTimers();renderSavedTimers()}
function load(){try{const raw=localStorage.getItem('round-fitness-v1');if(!raw)return;const data=JSON.parse(raw);if(!Array.isArray(data))return;blocks=data.filter(b=>b&&typeof b==='object').map((b,bi)=>({name:String(b.name||'Bloco '+(bi+1)),open:!!b.open,standalone:!!b.standalone,rounds:Array.isArray(b.rounds)?b.rounds.filter(r=>r&&typeof r==='object').map((r,ri)=>({name:String(r.name||'Round '+(ri+1)),duration:Math.max(1,Math.min(3600,Number(r.duration)||50)),rest:Math.max(0,Math.min(3600,Number(r.rest)||0))})):[]}));active=0;phaseMode='work';remaining=current()?totalSeconds(current()):0}catch(e){blocks=[]}}
function totalSeconds(r){return Math.max(1,Number(r?.duration)||50)}
function phaseLength(r){return phaseMode==='rest'?Math.max(0,Number(r?.rest)||0):totalSeconds(r)}
function current(){return rounds()[active]}
function stop(){running=false;if(interval)clearInterval(interval);interval=null;lastStamp=0;$('playLabel').textContent='INICIAR';$('playIcon').innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'}
function renderTimer(){
 const list=rounds(),r=list[active];
 if(!r){$('clock').textContent='00:00';$('phase').textContent='PRONTO';$('currentName').textContent='Adicione seu primeiro round';$('counter').textContent='Nenhum round configurado';$('progress').style.width='0%';$('clockRing').style.setProperty('--ring-progress','0%');$('play').disabled=true;$('play').style.opacity='.45';return}
 $('play').disabled=false;$('play').style.opacity='1';if(remaining<=0&&!running)remaining=phaseMode==='rest'?Math.max(0,Number(r.rest)||0):totalSeconds(r);
 const duration=Math.max(1,phaseMode==='rest'?(Number(r.rest)||1):totalSeconds(r));
 const elapsed=Math.max(0,Math.min(1,remaining/duration));
 $('clock').textContent=fmt(remaining);$('phase').textContent=phaseMode==='rest'?(running?'DESCANSO':'DESCANSO PAUSADO'):(running?'EM ANDAMENTO':(remaining<totalSeconds(r)?'PAUSADO':'PRONTO'));$('currentName').textContent=r.name||'Round';$('counter').textContent='Round '+(active+1)+' de '+list.length+' · '+r.blockName;$('progress').style.width=(elapsed*100)+'%';$('clockRing').style.setProperty('--ring-progress',(elapsed*100)+'%');
}
function render(){
 const host=$('blocks');host.innerHTML='';const n=rounds().length;const blockCount=blocks.filter(b=>!b.standalone).length;$('summary').textContent=blockCount+' bloco'+(blockCount===1?'':'s')+' · '+n+' round'+(n===1?'':'s');
 if(!blocks.length){host.innerHTML='<div class="empty"><strong>Seu treino começa aqui</strong>Nenhum bloco ou round foi criado.<br>Adicione um bloco ou round e personalize tudo.</div>';renderTimer();return}
 blocks.forEach((b,bi)=>{
 const el=document.createElement('section');el.className='block'+(b.open?' open':'');
 const duration=b.rounds.reduce((s,r)=>s+Number(r.duration||0)+Number(r.rest||0),0);
 el.classList.toggle('standalone',!!b.standalone);el.innerHTML='<div class="block-top"><button class="iconbtn drag-handle" aria-label="Arrastar para organizar" title="Arraste para organizar">⠿</button><div class="block-index">'+String(bi+1).padStart(2,'0')+'</div><div class="block-title"><strong></strong><small></small></div><div class="block-actions"><button class="iconbtn up" title="Mover para cima">↑</button><button class="iconbtn down" title="Mover para baixo">↓</button><button class="iconbtn duplicate" title="Duplicar bloco">⧉</button><button class="iconbtn toggle" title="Editar bloco">✎</button><button class="iconbtn del" title="Excluir bloco">×</button></div></div><div class="block-body"><div class="fields"><div class="field namefield"><label>Nome do bloco</label><input class="bname" maxlength="60"></div></div><div class="rounds"></div><div class="block-footer"><span class="total"></span><div class="footer-actions"><button class="btn addInside">＋ Round</button></div></div></div>';
 el.querySelector('.block-title strong').textContent=b.standalone?'ROUND AVULSO':b.name;el.querySelector('.block-title small').textContent=b.standalone?'Round independente · '+fmt(duration):b.rounds.length+' round(s) · '+fmt(duration);
 el.querySelector('.bname').value=b.name;el.querySelector('.bname').closest('.field').style.display=b.standalone?'none':'';el.querySelector('.addInside').style.display=b.standalone?'none':'';el.querySelector('.total').textContent='Tempo do bloco: '+fmt(duration);
 el.querySelector('.bname').oninput=e=>{b.name=e.target.value||'Bloco sem nome';el.querySelector('.block-title strong').textContent=b.name;save();renderTimer()};
 const toggleBlock=()=>{b.open=!b.open;render()};el.querySelector('.block-top').onclick=e=>{if(e.target.closest('button'))return;toggleBlock()};el.querySelector('.block-top').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleBlock()}};el.querySelector('.toggle').onclick=toggleBlock;
 bindDrag(el.querySelector('.drag-handle'),el,'block',bi);el.querySelector('.up').onclick=()=>moveBlock(bi,-1);el.querySelector('.down').onclick=()=>moveBlock(bi,1);
 el.querySelector('.del').onclick=()=>{if(confirm('Excluir o bloco "'+b.name+'" e seus rounds?')){blocks.splice(bi,1);reindex();save();render()}};
 el.querySelector('.addInside').onclick=()=>{b.rounds.push({name:'Round '+(b.rounds.length+1),duration:50,rest:10});b.open=true;save();render()};
 el.querySelector('.duplicate').onclick=()=>{const copy={name:'Bloco '+(bi+2),open:true,rounds:b.rounds.map(r=>({...r}))};blocks.splice(bi+1,0,copy);blocks.forEach((block,i)=>{if(/^Bloco \d+$/.test(block.name))block.name='Bloco '+(i+1)});save();render()};
 const rh=el.querySelector('.rounds');
 b.rounds.forEach((r,ri)=>{
 const card=document.createElement('div');card.style.cssText='margin-top:10px;padding:12px;background:#08060c;border:1px solid #2e1b40;border-radius:12px';
 card.className='round-card';card.innerHTML='<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><button class="iconbtn drag-handle" aria-label="Arrastar round" title="Arraste para organizar" style="touch-action:none">⠿</button><strong style="font-size:11px;color:#c4b5fd;flex:1">ROUND '+(ri+1)+'</strong><button class="iconbtn ru" title="Mover round para cima">↑</button><button class="iconbtn rd" title="Mover round para baixo">↓</button><button class="iconbtn dup" title="Duplicar round">⧉</button><button class="iconbtn delr" title="Excluir round">×</button></div><div class="fields"><div class="field namefield"><label>Nome</label><input class="rname" maxlength="60"></div><div class="field"><label>Trabalho (seg)</label><input class="dur" type="number" min="1" max="3600"></div><div class="field"><label>Descanso (seg)</label><input class="rest" type="number" min="0" max="3600"></div></div>';
 card.querySelector('.rname').value=r.name;card.querySelector('.dur').value=r.duration;card.querySelector('.rest').value=r.rest;
 const update=()=>{save();renderTimer();el.querySelector('.block-title small').textContent=b.rounds.length+' round(s) · '+fmt(b.rounds.reduce((s,x)=>s+Number(x.duration||0)+Number(x.rest||0),0))};
 card.querySelector('.rname').oninput=e=>{r.name=e.target.value||'Round';update()};
 card.querySelector('.dur').onchange=e=>{r.duration=Math.max(1,Math.min(3600,Number(e.target.value)||1));if(activeRoundIs(bi,ri)&&phaseMode==='work')remaining=r.duration;update()};
 card.querySelector('.rest').onchange=e=>{r.rest=Math.max(0,Math.min(3600,Number(e.target.value)||0));if(activeRoundIs(bi,ri)&&phaseMode==='rest')remaining=r.rest;update()};
 bindDrag(card.querySelector('.drag-handle'),card,'round',bi,ri);card.querySelector('.ru').onclick=()=>moveRound(bi,ri,-1);card.querySelector('.rd').onclick=()=>moveRound(bi,ri,1);
 card.querySelector('.dup').onclick=()=>{b.rounds.splice(ri+1,0,{...r,name:r.name+' (cópia)'});save();render()};
 card.querySelector('.delr').onclick=()=>{b.rounds.splice(ri,1);if(!b.rounds.length){blocks.splice(bi,1)}reindex();save();render()};
 rh.appendChild(card);
 });
 host.appendChild(el);
 });
 renderTimer();
}
function bindDrag(handle,el,type,bi,ri){let start=null;handle.onpointerdown=e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();start={x:e.clientX,y:e.clientY,moved:false};handle.setPointerCapture(e.pointerId);el.classList.add('dragging')};handle.onpointermove=e=>{if(!start)return;if(Math.abs(e.clientY-start.y)>8)start.moved=true};handle.onpointerup=e=>{if(!start)return;const moved=start.moved;start=null;el.classList.remove('dragging');if(!moved)return;const target=document.elementFromPoint(e.clientX,e.clientY);if(type==='block'){const dest=target?.closest('.block');if(dest&&dest!==el){const from=Array.from($('blocks').children).indexOf(el),to=Array.from($('blocks').children).indexOf(dest);if(from>=0&&to>=0){const item=blocks.splice(from,1)[0];blocks.splice(to,0,item);save();render()}}}else{const dest=target?.closest('.round-card');if(dest&&dest!==el){const sourceBlock=blocks[bi];if(!sourceBlock)return;const from=Array.from(el.parentElement.children).indexOf(el),to=Array.from(dest.parentElement.children).indexOf(dest);if(dest.parentElement===el.parentElement&&from>=0&&to>=0){const item=sourceBlock.rounds.splice(from,1)[0];sourceBlock.rounds.splice(to,0,item);save();render()}}}};handle.onpointercancel=()=>{start=null;el.classList.remove('dragging')}}
function activeRoundIs(bi,ri){const r=current();return r&&r.bi===bi&&r.ri===ri}
function reindex(){active=Math.min(active,Math.max(0,rounds().length-1));phaseMode='work';remaining=current()?totalSeconds(current()):0;stop();if(!rounds().length)document.querySelector('.app').classList.remove('focus-mode')}
function moveBlock(i,d){const j=i+d;if(j<0||j>=blocks.length)return;[blocks[i],blocks[j]]=[blocks[j],blocks[i]];save();render()}
function moveRound(bi,ri,d){const j=ri+d;if(j<0||j>=blocks[bi].rounds.length)return;[blocks[bi].rounds[ri],blocks[bi].rounds[j]]=[blocks[bi].rounds[j],blocks[bi].rounds[ri]];save();render()}
function addBlock(){blocks.push({name:'Bloco '+(blocks.length+1),open:true,rounds:[]});save();render()}
function addRound(){const count=rounds().length+1;blocks.push({name:'Round avulso '+count,open:true,standalone:true,rounds:[{name:'Round '+count,duration:50,rest:10}]});save();render()}
function advance(){const list=rounds();if(!list.length)return;active=(active+1)%list.length;phaseMode='work';remaining=totalSeconds(current());renderTimer()}
function back(){const list=rounds();if(!list.length)return;active=(active-1+list.length)%list.length;phaseMode='work';remaining=totalSeconds(current());renderTimer()}
function tick(){const now=Date.now();if(!lastStamp)lastStamp=now;const delta=(now-lastStamp)/1000;lastStamp=now;remaining-=delta;if(remaining<=0){const r=current();if(phaseMode==='work'&&Number(r?.rest)>0){phaseMode='rest';remaining=Number(r.rest)}else{phaseMode='work';const list=rounds();if(!list.length){stop();return}active=(active+1)%list.length;remaining=totalSeconds(current())}}renderTimer()}
function toggle(){if(!rounds().length)return;if(running){stop();renderTimer()}else{document.querySelector('.app').classList.add('focus-mode');running=true;lastStamp=Date.now();$('playLabel').textContent='PAUSAR';$('playIcon').innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'; interval=setInterval(tick,100)}}
$('addBlock').onclick=addBlock;$('addRound').onclick=addRound;$('saveTimer').onclick=saveCurrentTimer;$('play').onclick=toggle;$('next').onclick=()=>{advance();};$('prev').onclick=back;
$('reset').onclick=()=>{stop();phaseMode='work';remaining=current()?totalSeconds(current()):0;document.querySelector('.app').classList.remove('focus-mode');renderTimer()};
$('clearAll').onclick=()=>{if(blocks.length&&confirm('Apagar todos os blocos e rounds?')){stop();document.querySelector('.app').classList.remove('focus-mode');blocks=[];active=0;remaining=0;save();render()}};
load();render();loadSavedTimers();renderSavedTimers();
</script></body></html>
